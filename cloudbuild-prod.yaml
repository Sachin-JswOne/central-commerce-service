steps:
  # ----------------------------
  # 1. Sanity check
  # ----------------------------
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "pwd && ls"]

  # ----------------------------
  # 2. Copy prod config (if required)
  # ----------------------------
  - name: "maven:3.9.6-eclipse-temurin-21"
    entrypoint: "cp"
    args:
      - "central-commerce-application/src/main/resources/application-prod.properties"
      - "central-commerce-application/src/main/resources/application.properties"
    dir: "."

  # ----------------------------
  # 3. Maven build
  # ----------------------------
  - name: "maven:3.9.6-eclipse-temurin-21"
    entrypoint: "mvn"
    args:
      - "-B"
      - "-DskipTests"
      - "clean"
      - "install"
    dir: "."

  # ----------------------------
  # 4. Verify JAR
  # ----------------------------
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - "ls -lh central-commerce-application/target"
    dir: "."

  # ----------------------------
  # 5. Build Docker image
  # ----------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA",
        "-f",
        "Dockerfile",
        ".",
      ]

  # ----------------------------
  # 6. Push Docker image
  # ----------------------------
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA"]

  # ----------------------------
  # 7. Deploy to Cloud Run
  # ----------------------------
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "central-commerce-service"
      - "--image=gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--set-secrets=GCP_CREDENTIALS=GCP_CREDENTIALS:latest,GCP_PROJ_ID=GCP_PROJ_ID:latest,CTP_ADMIN_CLIENT_ID=CTP_ADMIN_CLIENT_ID:latest,CTP_ADMIN_PROJECTKEY=CTP_ADMIN_PROJECTKEY:latest,CTP_ADMIN_CLIENTSECRET=CTP_ADMIN_CLIENTSECRET:latest,CTP_ADMIN_SCOPE=CTP_ADMIN_SCOPE:latest,CTP_REGISTERED_CLIENTID=CTP_REGISTERED_CLIENTID:latest,CTP_REGISTERED_CLIENTSECRET=CTP_REGISTERED_CLIENTSECRET:latest,HISTORICAL_DB_PASSWORD=HISTORICAL_DB_PASSWORD:latest,NOTIFICATION_SERVICE_TOKEN=NOTIFICATION_SERVICE_TOKEN:latest,JWT_SECRET=JWT_SECRET:latest,SF_CLIENT_SECRET=SF_CLIENT_SECRET:latest,SF_CLIENT_USERNAME=SF_CLIENT_USERNAME:latest,SF_CLIENT_PASSWORD=SF_CLIENT_PASSWORD:latest,SMTP_API_KEY=SMTP_API_KEY:latest,REDIS_PROD_PASSWORD=REDIS_PROD_PASSWORD:latest,RDASH_AUTH_TOKEN=RDASH_AUTH_TOKEN:latest,CENTRAL_AUTH_TOKEN=CENTRAL_AUTH_TOKEN:latest,JWT_SECRET_SALT=JWT_SECRET_SALT:latest,NOTIFICATION_API_KEY=NOTIFICATION_API_KEY:latest"

images:
  - "gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY