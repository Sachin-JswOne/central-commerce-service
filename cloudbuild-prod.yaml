steps:
  # ----------------------------
  # 1. Sanity check
  # ----------------------------
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "pwd && ls"]

  # ----------------------------
  # 2. Copy prod config (if required)
  # ----------------------------
  - name: "maven:3.9.6-eclipse-temurin-21"
    entrypoint: "cp"
    args:
      - "central-commerce-application/src/main/resources/application-prod.properties"
      - "central-commerce-application/src/main/resources/application.properties"
    dir: "."

  # ----------------------------
  # 3. Maven build
  # ----------------------------
  - name: "maven:3.9.6-eclipse-temurin-21"
    entrypoint: "mvn"
    args:
      - "-B"
      - "-DskipTests"
      - "clean"
      - "install"
    dir: "."

  # ----------------------------
  # 4. Verify JAR
  # ----------------------------
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - "ls -lh central-commerce-application/target"
    dir: "."

  # ----------------------------
  # 5. Build Docker image
  # ----------------------------
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA",
        "-f",
        "Dockerfile",
        ".",
      ]

  # ----------------------------
  # 6. Push Docker image
  # ----------------------------
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA"]

  # ----------------------------
  # 7. Deploy to Cloud Run
  # ----------------------------
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "central-commerce-service"
      - "--image=gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--set-secrets=GCP-CREDENTIALS=GCP-CREDENTIALS:latest,GCP-PROJ-ID=GCP-PROJ-ID:latest,CTP-ADMIN-CLIENT-ID=CTP-ADMIN-CLIENT-ID:latest,CTP-ADMIN-PROJECTKEY=CTP-ADMIN-PROJECTKEY:latest,CTP-ADMIN-CLIENTSECRET=CTP-ADMIN-CLIENTSECRET:latest,CTP-ADMIN-SCOPE=CTP-ADMIN-SCOPE:latest,CTP-REGISTERED-CLIENTID=CTP-REGISTERED-CLIENTID:latest,CTP-REGISTERED-CLIENTSECRET=CTP-REGISTERED-CLIENTSECRET:latest,HISTORICAL_DB_PASSWORD=HISTORICAL_DB_PASSWORD:latest,NOTIFICATION_SERVICE_TOKEN=NOTIFICATION_SERVICE_TOKEN:latest,JWT_SECRET=JWT_SECRET:latest"

images:
  - "gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY