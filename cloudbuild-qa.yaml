steps:
  # ----------------------------
  # 1. Sanity check
  # ----------------------------
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'pwd && ls']

  # ----------------------------
  # 2. Copy prod config (if required)
  # ----------------------------
  - name: 'maven:3.9.6-eclipse-temurin-21'
    entrypoint: 'cp'
    args:
      - 'central-commerce-application/src/main/resources/application-qa.properties'
      - 'central-commerce-application/src/main/resources/application.properties'
    dir: "."

  # ----------------------------
  # 3. Maven build
  # ----------------------------
  - name: 'maven:3.9.6-eclipse-temurin-21'
    entrypoint: 'mvn'
    args:
      - '-B'
      - '-DskipTests'
      - 'clean'
      - 'package'
    dir: "central-commerce-application"

  # ----------------------------
  # 4. Verify JAR
  # ----------------------------
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'ls -lh central-commerce-application/target'
    dir: "."

  # ----------------------------
  # 5. Build Docker image
  # ----------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA',
        '-f',
        'Dockerfile',
        '.'
      ]

  # ----------------------------
  # 6. Push Docker image
  # ----------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA'
      ]

  # ----------------------------
  # 7. Deploy to Cloud Run
  # ----------------------------
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run',
        'deploy',
        'central-commerce-service',
        '--image',
        'gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA',
        '--region',
        'asia-south1',
        '--platform',
        'managed',
        '--allow-unauthenticated'
      ]

images:
  - 'gcr.io/$PROJECT_ID/central-commerce-service:$COMMIT_SHA'
